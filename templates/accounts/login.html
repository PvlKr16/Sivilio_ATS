{% load static i18n %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Sign In — HR Platform" %}</title>
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/forms.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon"><i class="fas fa-users-gear"></i></div>
      <h1>{% trans "HR Platform" %}</h1>
      <p>{% trans "IT People" %} &amp; {% trans "Company Management" %}</p>
    </div>

    {% if form.errors %}
    <div class="login-error">
      <i class="fas fa-circle-exclamation"></i>
      {% trans "Invalid username or password. Please try again." %}
    </div>
    {% endif %}

    <form method="post" action="{% url 'accounts:login' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">

      <div class="form-group">
        <label class="form-label" for="id_username">Email</label>
        <div class="input-group">
          <span class="input-group-icon"><i class="fas fa-envelope"></i></span>
          <input type="email" id="id_username" name="username"
                 class="form-control" autocomplete="email"
                 autofocus required placeholder="Enter your email">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="id_password">{% trans "Password" %}</label>
        <div class="input-group">
          <span class="input-group-icon"><i class="fas fa-lock"></i></span>
          <input type="password" id="id_password" name="password"
                 class="form-control" autocomplete="current-password"
                 required placeholder="Enter your password">
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-submit">
        <i class="fas fa-right-to-bracket"></i>{% trans "Sign In" %}
      </button>
    </form>
  </div>
  <script src="{% static 'js/ui.js' %}"></script>
</body>
</html>
