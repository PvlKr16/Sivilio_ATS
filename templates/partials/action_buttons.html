{# templates/partials/action_buttons.html — rendered by ui_tags.action_buttons #}
<td class="actions-cell">
  <div style="display:flex;flex-direction:row;gap:4px;justify-content:flex-end;">
    <a href="{{ view_url }}" class="btn btn-sm btn-outline-primary" title="View">
      <i class="fas fa-eye"></i>
    </a>
    {% if edit_perm %}
    <a href="{{ edit_url }}" class="btn btn-sm btn-outline-primary" title="Edit">
      <i class="fas fa-pen"></i>
    </a>
    {% endif %}
    {% if delete_perm %}
    <a href="{{ delete_url }}" class="btn btn-sm btn-outline-danger"
       data-confirm="{{ confirm_msg }}" title="Delete">
      <i class="fas fa-trash"></i>
    </a>
    {% endif %}
  </div>
</td>
